services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: blog
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ublog", "-pblog"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразовый контейнер для сборки стилей: в php-образе node не нужен.
  # Профиль tools не даёт ему стартовать вместе с docker compose up.
  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    profiles:
      - tools

volumes:
  mysql-data:
